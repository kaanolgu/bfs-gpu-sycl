workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - compiler
  - build_test

variables:
  CUDA_ARCH: "75"
  SM_FACTOR: "40"  # Tesla T4 = 40 SMs
  GPU_TARGETS: "1"
  DPCPP_NIGHTLY_URL: "https://github.com/intel/llvm/releases/download/nightly-2026-03-12/sycl_linux.tar.gz"
  DPCPP_TAG: "nightly-2026-03-12"
  DATASET: "rmat-19-16-nnz"

compiler:
  stage: compiler
  interruptible: true
  tags:
    - saas-linux-medium-amd64-gpu-standard
  image: nvcr.io/nvidia/cuda:12.8.0-devel-ubuntu22.04
  cache:
    key: "dpcpp-prebuilt-${DPCPP_TAG}"
    paths:
      - dpcpp-install/
    policy: pull-push
  script:
    - |
      if [ -f "dpcpp-install/bin/clang++" ]; then
        echo "DPC++ ${DPCPP_TAG} found in cache, skipping download."
        dpcpp-install/bin/clang++ --version
        exit 0
      fi
      echo "Downloading Intel DPC++ pre-built nightly ${DPCPP_TAG}..."
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends curl ca-certificates
      mkdir -p dpcpp-install
      curl -sSL --retry 3 --retry-delay 5 "${DPCPP_NIGHTLY_URL}" | tar -xz -C dpcpp-install --strip-components=1
      echo "DPC++ downloaded and extracted"
      dpcpp-install/bin/clang++ --version
  artifacts:
    name: "dpcpp-${DPCPP_TAG}"
    paths:
      - dpcpp-install/
    expire_in: 1 week

build_test:
  stage: build_test
  interruptible: true
  tags:
    - saas-linux-medium-amd64-gpu-standard
  image: nvcr.io/nvidia/cuda:12.8.0-devel-ubuntu22.04
  needs:
    - job: compiler
      artifacts: true
  script:
    - |
      nvidia-smi || echo "WARNING: nvidia-smi unavailable, continuing"
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends cmake ninja-build python3 libhwloc-dev
      export PATH="${CI_PROJECT_DIR}/dpcpp-install/bin:$PATH"
      export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/dpcpp-install/lib:$LD_LIBRARY_PATH"
      clang++ --version
      cmake -Bbuild_local -H. -GNinja -DENABLE_NVIDIA_BACKEND=ON -DCUDA_ARCH=${CUDA_ARCH} -DGPU_TARGETS=${GPU_TARGETS} -DENABLE_VERBOSE=OFF -DUSE_GLOBAL_LOAD_BALANCE=OFF -DUSE_STRIDED_LOCAL_LOAD_BALANCE=OFF -DSM_FACTOR=${SM_FACTOR}
      cmake --build build_local -- -j$(nproc)
      cmake -Bbuild_global -H. -GNinja -DENABLE_NVIDIA_BACKEND=ON -DCUDA_ARCH=${CUDA_ARCH} -DGPU_TARGETS=${GPU_TARGETS} -DENABLE_VERBOSE=OFF -DUSE_GLOBAL_LOAD_BALANCE=ON -DUSE_STRIDED_LOCAL_LOAD_BALANCE=OFF -DSM_FACTOR=${SM_FACTOR}
      cmake --build build_global -- -j$(nproc)
      cmake -Bbuild_stride_local -H. -GNinja -DENABLE_NVIDIA_BACKEND=ON -DCUDA_ARCH=${CUDA_ARCH} -DGPU_TARGETS=${GPU_TARGETS} -DENABLE_VERBOSE=OFF -DUSE_GLOBAL_LOAD_BALANCE=OFF -DUSE_STRIDED_LOCAL_LOAD_BALANCE=ON -DSM_FACTOR=${SM_FACTOR}
      cmake --build build_stride_local -- -j$(nproc)
      unset CUDA_INJECTION64_PATH || true
      chmod +x build_local/bfs_1.gpu build_global/bfs_1.gpu build_stride_local/bfs_1.gpu
      nvidia-smi
      sycl-ls
      echo "Using dataset: ${DATASET}"
      echo "===== Testing LLB ====="
      ONEAPI_DEVICE_SELECTOR=cuda:0 ./build_local/bfs_1.gpu --dataset=${DATASET} --root=0 --num_runs=1
      echo "===== Testing GLB ====="
      ONEAPI_DEVICE_SELECTOR=cuda:0 ./build_global/bfs_1.gpu --dataset=${DATASET} --root=0 --num_runs=1
      echo "===== Testing SLB ====="
      ONEAPI_DEVICE_SELECTOR=cuda:0 ./build_stride_local/bfs_1.gpu --dataset=${DATASET} --root=0 --num_runs=1
      echo "All GPU tests passed!"
  artifacts:
    paths:
      - build_local/bfs_1.gpu
      - build_global/bfs_1.gpu
      - build_stride_local/bfs_1.gpu
    expire_in: 1 hour
